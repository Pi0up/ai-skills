<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Architecture Studio - Visualizer</title>
  <!-- Mermaid v10 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg-app: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-canvas: #090d16;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --bg-inspector: #1e293b;
      --border-color: #334155;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-subtle: rgba(59, 130, 246, 0.15);
      --badge-sitemap: #8b5cf6;
      --badge-userflow: #0ea5e9;
      --badge-reference: #10b981;
      --badge-bg: rgba(255, 255, 255, 0.08);
      --grid-dot: #1e293b;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-app: #f8fafc;
      --bg-sidebar: #ffffff;
      --bg-canvas: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-inspector: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #2563eb;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: rgba(37, 99, 235, 0.1);
      --grid-dot: #cbd5e1;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
    }

    /* Layout Containers */
    #sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 20;
      transition: transform 0.25s ease, margin-left 0.25s ease;
    }

    #sidebar.collapsed {
      margin-left: -320px;
    }

    #main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-canvas);
    }

    #inspector {
      width: 360px;
      min-width: 360px;
      background: var(--bg-inspector);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 20;
      transition: transform 0.25s ease, margin-right 0.25s ease;
      box-shadow: var(--shadow-lg);
    }

    #inspector.collapsed {
      margin-right: -360px;
    }

    /* Sidebar Components */
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .brand-badge {
      font-size: 10px;
      background: var(--primary-subtle);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sidebar-search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px 8px 32px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--text-subtle);
      pointer-events: none;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .filter-pill {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .filter-pill:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .filter-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .diagram-item {
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: var(--bg-card);
    }

    .diagram-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
    }

    .diagram-item.active {
      background: var(--primary-subtle);
      border-color: var(--primary);
    }

    .diagram-item__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .diagram-item__title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .badge-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-sitemap {
      background: rgba(139, 92, 246, 0.18);
      color: #a78bfa;
    }

    .badge-userflow {
      background: rgba(14, 165, 233, 0.18);
      color: #38bdf8;
    }

    .diagram-item__desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Top Toolbar */
    .top-toolbar {
      height: 56px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-tool {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-tool:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--border-focus);
    }

    .btn-tool.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-tool.primary:hover {
      background: var(--primary-hover);
    }

    .active-diagram-title {
      font-size: 14px;
      font-weight: 600;
      margin-left: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Canvas Viewport */
    .canvas-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      user-select: none;
    }

    .canvas-viewport:active {
      cursor: grabbing;
    }

    #svg-canvas-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 0.05s linear;
      display: inline-block;
      padding: 40px;
    }

    /* Floating Zoom Controls */
    .floating-controls {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 15;
    }

    .floating-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 16px;
    }

    .floating-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .floating-btn + .floating-btn {
      border-top: 1px solid var(--border-color);
    }

    /* Inspector Drawer */
    .inspector-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .node-header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .node-code {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .node-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .node-url {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      word-break: break-all;
    }

    .meta-section {
      margin-bottom: 20px;
    }

    .meta-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .meta-pill {
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .meta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 8px;
    }

    .meta-table td {
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .meta-table td:first-child {
      color: var(--text-subtle);
      width: 100px;
    }

    .meta-table td:last-child {
      color: var(--text-main);
      font-weight: 500;
    }

    .screen-sheet-btn {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      transition: all 0.15s ease;
    }

    .screen-sheet-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
    }

    /* Modal for Screen Sheet */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    .modal-body pre {
      background: var(--bg-canvas);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
    }

    /* Interactive SVG Node Styling */
    svg g.node {
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    svg g.node:hover {
      filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.6));
    }

    svg g.node.selected rect,
    svg g.node.selected polygon,
    svg g.node.selected circle,
    svg g.node.selected path {
      stroke: #3b82f6 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
    }

    /* Loading Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Print Styles */
    @media print {
      @page {
        size: landscape;
        margin: 10mm;
      }

      body {
        background: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
      }

      #sidebar, #inspector, .top-toolbar, .floating-controls, .modal-overlay {
        display: none !important;
      }

      #main-viewport {
        background: #ffffff !important;
        overflow: visible !important;
      }

      .canvas-viewport {
        background: #ffffff !important;
        overflow: visible !important;
      }

      #svg-canvas-wrapper {
        position: static !important;
        transform: none !important;
        padding: 0 !important;
      }

      svg {
        max-width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body data-theme="dark">

  <!-- Left Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">
        <span>Information Architecture</span>
        <span class="brand-badge">STUDIO</span>
      </div>
      <button class="btn-tool" id="btn-theme-toggle" title="Toggle Theme">🌓</button>
    </div>

    <div class="sidebar-search-box">
      <div class="search-input-wrapper">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search diagrams or nodes...">
      </div>
    </div>

    <div class="filter-pills">
      <button class="filter-pill active" data-category="all">All (<span id="count-all">0</span>)</button>
      <button class="filter-pill" data-category="sitemap">Sitemaps (<span id="count-sitemap">0</span>)</button>
      <button class="filter-pill" data-category="userflow">Userflows (<span id="count-userflow">0</span>)</button>
    </div>

    <div class="sidebar-list" id="diagram-list">
      <!-- Diagram items rendered dynamically -->
    </div>
  </aside>

  <!-- Main Viewport -->
  <main id="main-viewport">
    <div class="top-toolbar">
      <div class="toolbar-left">
        <button class="btn-tool" id="btn-toggle-sidebar" title="Toggle Sidebar">☰</button>
        <div class="active-diagram-title">
          <span id="current-diagram-title">Select a Diagram</span>
          <span class="badge-tag" id="current-diagram-badge" style="display:none;"></span>
        </div>
      </div>

      <div class="toolbar-right">
        <button class="btn-tool" id="btn-export-png-hd" title="Export High-Resolution PNG (Retina 2x)">📸 Export PNG HD</button>
        <button class="btn-tool" id="btn-export-png" title="Export Standard PNG">🖼️ PNG</button>
        <button class="btn-tool" id="btn-export-svg" title="Export Vector SVG">⚡ SVG</button>
        <button class="btn-tool" id="btn-print" title="Print Diagram">🖨️ Print</button>
        <button class="btn-tool" id="btn-toggle-inspector" title="Toggle Inspector">📋</button>
      </div>
    </div>

    <div class="canvas-viewport" id="canvas-viewport">
      <div id="svg-canvas-wrapper">
        <div id="mermaid-render-target"></div>
      </div>

      <!-- Floating Zoom Controls -->
      <div class="floating-controls">
        <button class="floating-btn" id="btn-zoom-in" title="Zoom In">+</button>
        <button class="floating-btn" id="btn-zoom-out" title="Zoom Out">-</button>
        <button class="floating-btn" id="btn-zoom-reset" title="Fit to View">⤢</button>
        <button class="floating-btn" id="btn-zoom-actual" title="Actual Size (1:1)">1:1</button>
      </div>
    </div>
  </main>

  <!-- Right Inspector Drawer -->
  <aside id="inspector" class="collapsed">
    <div class="inspector-header">
      <div class="inspector-title">
        <span>🔍 Node Inspector</span>
      </div>
      <button class="btn-tool" id="btn-close-inspector">✕</button>
    </div>

    <div class="inspector-body" id="inspector-content">
      <div style="color: var(--text-subtle); text-align: center; margin-top: 40px;">
        Click on any node in the diagram to inspect its metadata, roles, URLs and screen sheet.
      </div>
    </div>
  </aside>

  <!-- Screen Sheet Modal -->
  <div class="modal-overlay" id="screen-sheet-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-sheet-title">Screen Sheet</h3>
        <button class="btn-tool" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body" id="modal-sheet-body">
        <!-- Rendered Screen Sheet markdown/pre -->
      </div>
    </div>
  </div>

  <!-- Embedded Data Store (Generated by CLI) -->
  <script id="ia-data-store" type="application/json">
{{EMBEDDED_JSON_DATA}}
  </script>

  <!-- Visualizer Application Logic -->
  <script>
    (function() {
      // 1. Data Store initialization
      let dataStore = { diagrams: [], nodes: {}, screen_sheets: {} };
      try {
        const rawJson = document.getElementById('ia-data-store').textContent.trim();
        if (rawJson && rawJson !== '{{EMBEDDED_JSON_DATA}}') {
          dataStore = JSON.parse(rawJson);
        }
      } catch (err) {
        console.error('Failed to parse embedded IA data store:', err);
      }

      // 2. State
      let activeDiagramId = null;
      let activeCategory = 'all';
      let searchQuery = '';
      let selectedNodeCode = null;

      // Pan & Zoom state
      let scale = 1;
      let panX = 40;
      let panY = 40;
      let isPanning = false;
      let startX = 0;
      let startY = 0;

      const viewport = document.getElementById('canvas-viewport');
      const canvasWrapper = document.getElementById('svg-canvas-wrapper');
      const renderTarget = document.getElementById('mermaid-render-target');
      const diagramListEl = document.getElementById('diagram-list');
      const inspectorEl = document.getElementById('inspector');
      const inspectorContent = document.getElementById('inspector-content');

      // Initialize Mermaid
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'base',
        themeVariables: {
          primaryColor: '#3b82f6',
          primaryTextColor: '#ffffff',
          primaryBorderColor: '#2563eb',
          lineColor: '#64748b',
          secondaryColor: '#8b5cf6',
          tertiaryColor: '#1e293b'
        },
        flowchart: {
          curve: 'basis',
          nodeSpacing: 50,
          rankSpacing: 60,
          htmlLabels: true
        }
      });

      // 3. UI Helper functions
      function updateCanvasTransform() {
        canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      function resetZoom() {
        const svg = renderTarget.querySelector('svg');
        if (!svg) return;
        const rect = svg.getBoundingClientRect();
        const vRect = viewport.getBoundingClientRect();
        
        const scaleX = (vRect.width - 100) / (rect.width / scale);
        const scaleY = (vRect.height - 100) / (rect.height / scale);
        scale = Math.min(Math.max(Math.min(scaleX, scaleY), 0.25), 1.5);
        
        panX = Math.max(30, (vRect.width - (rect.width / (scale || 1) * scale)) / 2);
        panY = Math.max(30, (vRect.height - (rect.height / (scale || 1) * scale)) / 2);
        updateCanvasTransform();
      }

      // Pan & Zoom Events
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.floating-controls') || e.target.closest('g.node')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateCanvasTransform();
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
      });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = 1.12;
        const mouseX = e.clientX - viewport.getBoundingClientRect().left;
        const mouseY = e.clientY - viewport.getBoundingClientRect().top;

        const prevScale = scale;
        if (e.deltaY < 0) {
          scale = Math.min(scale * zoomFactor, 4.0);
        } else {
          scale = Math.max(scale / zoomFactor, 0.15);
        }

        panX = mouseX - (mouseX - panX) * (scale / prevScale);
        panY = mouseY - (mouseY - panY) * (scale / prevScale);
        updateCanvasTransform();
      }, { passive: false });

      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        scale = Math.min(scale * 1.25, 4.0);
        updateCanvasTransform();
      });

      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        scale = Math.max(scale / 1.25, 0.15);
        updateCanvasTransform();
      });

      document.getElementById('btn-zoom-reset').addEventListener('click', resetZoom);

      document.getElementById('btn-zoom-actual').addEventListener('click', () => {
        scale = 1.0;
        panX = 50;
        panY = 50;
        updateCanvasTransform();
      });

      // 4. Render Diagram Function
      async function renderDiagram(diagram) {
        if (!diagram) return;
        activeDiagramId = diagram.id;

        document.getElementById('current-diagram-title').textContent = diagram.title || diagram.id;
        const badgeEl = document.getElementById('current-diagram-badge');
        badgeEl.textContent = (diagram.type || 'sitemap').toUpperCase();
        badgeEl.className = 'badge-tag ' + (diagram.type === 'userflow' ? 'badge-userflow' : 'badge-sitemap');
        badgeEl.style.display = 'inline-block';

        // Update active class in sidebar
        document.querySelectorAll('.diagram-item').forEach(el => {
          el.classList.toggle('active', el.dataset.id === diagram.id);
        });

        renderTarget.innerHTML = '<div style="padding: 40px; color: var(--text-muted);"><span class="spinner"></span> Rendering diagram...</div>';

        try {
          // Clean diagram source: strip frontmatter if present for mermaid renderer
          let source = diagram.source || '';
          if (source.startsWith('---')) {
            const endIdx = source.indexOf('---', 3);
            if (endIdx !== -1) {
              source = source.substring(endIdx + 3).trim();
            }
          }

          const renderId = 'mermaid-' + Math.random().toString(36).substring(2, 9);
          const { svg } = await mermaid.render(renderId, source);
          renderTarget.innerHTML = svg;

          // Attach node interactivity
          setupNodeInteractivity();
          resetZoom();
        } catch (err) {
          console.error('Mermaid render error:', err);
          renderTarget.innerHTML = `<div style="padding: 24px; color: #ef4444; background: rgba(239, 68, 68, 0.1); border-radius: 8px;">
            <strong>Render Error:</strong><br>${err.message || err}
          </div>`;
        }
      }

      // 5. Node Interactivity & Inspector
      function setupNodeInteractivity() {
        const svg = renderTarget.querySelector('svg');
        if (!svg) return;

        const nodes = svg.querySelectorAll('g.node');
        nodes.forEach(nodeEl => {
          nodeEl.style.cursor = 'pointer';

          // Extract text inside node to deduce node code
          const rawText = nodeEl.textContent.trim();
          let matchedCode = null;

          // Look for direct match in node registry
          for (const code of Object.keys(dataStore.nodes || {})) {
            if (rawText.startsWith(code) || rawText.includes(code)) {
              matchedCode = code;
              break;
            }
          }

          if (matchedCode) {
            nodeEl.dataset.nodeCode = matchedCode;
          }

          nodeEl.addEventListener('click', (e) => {
            e.stopPropagation();
            nodes.forEach(n => n.classList.remove('selected'));
            nodeEl.classList.add('selected');

            const code = nodeEl.dataset.nodeCode;
            if (code && dataStore.nodes[code]) {
              showInspector(dataStore.nodes[code]);
            } else {
              // Fallback with minimal info
              showInspector({
                code: rawText.split(' ')[0] || 'Node',
                label: rawText,
                url: '-'
              });
            }
          });
        });
      }

      function showInspector(node) {
        selectedNodeCode = node.code;
        inspectorEl.classList.remove('collapsed');

        let rolesHtml = '';
        if (node.roles && node.roles.length) {
          rolesHtml = node.roles.map(r => `<span class="meta-pill">${r}</span>`).join(' ');
        } else {
          rolesHtml = '<span class="meta-pill">ALL</span>';
        }

        let inputsHtml = '-';
        if (node.inputs && node.inputs.length) {
          inputsHtml = node.inputs.map(i => `<span class="meta-pill">${i}</span>`).join(' ');
        }

        let outputsHtml = '-';
        if (node.outputs && node.outputs.length) {
          outputsHtml = node.outputs.map(o => `<span class="meta-pill">${o}</span>`).join(' ');
        }

        let signalsHtml = '-';
        if (node.signals && node.signals.length) {
          signalsHtml = node.signals.map(s => `<span class="meta-pill">${s}</span>`).join(' ');
        }

        const hasSheet = dataStore.screen_sheets && dataStore.screen_sheets[node.code];

        inspectorContent.innerHTML = `
          <div class="node-header-card">
            <div class="node-code">${node.code}</div>
            <div class="node-label">${node.label || node.code}</div>
            <div class="node-url">${node.url || '/'}</div>
          </div>

          <div class="meta-section">
            <div class="meta-label">Properties</div>
            <table class="meta-table">
              <tr><td>Template</td><td>${node.template_label || node.template || 'Page'}</td></tr>
              <tr><td>Access</td><td>${node.is_protected ? '🔒 Protected (Auth)' : '🌐 Public'}</td></tr>
              <tr><td>Nature</td><td>${node.nature || 'Relative'}</td></tr>
              <tr><td>Order</td><td>#${node.order != null ? String(node.order).padStart(2, '0') : '01'}</td></tr>
            </table>
          </div>

          <div class="meta-section">
            <div class="meta-label">Roles & Permissions</div>
            <div class="meta-pills">${rolesHtml}</div>
          </div>

          <div class="meta-section">
            <div class="meta-label">Inputs (ctx_in)</div>
            <div class="meta-pills">${inputsHtml}</div>
          </div>

          <div class="meta-section">
            <div class="meta-label">Outputs (ctx_out)</div>
            <div class="meta-pills">${outputsHtml}</div>
          </div>

          <div class="meta-section">
            <div class="meta-label">Tracking Signals</div>
            <div class="meta-pills">${signalsHtml}</div>
          </div>

          ${hasSheet ? `
            <button class="screen-sheet-btn" id="btn-view-sheet">
              📄 View Screen Sheet (${node.code})
            </button>
          ` : ''}
        `;

        if (hasSheet) {
          document.getElementById('btn-view-sheet').addEventListener('click', () => {
            const sheet = dataStore.screen_sheets[node.code];
            document.getElementById('modal-sheet-title').textContent = `Screen Sheet: ${node.code}`;
            document.getElementById('modal-sheet-body').innerHTML = `<pre>${sheet.content || 'No content'}</pre>`;
            document.getElementById('screen-sheet-modal').classList.add('active');
          });
        }
      }

      // 6. Sidebar Diagrams List Filter & Rendering
      function renderDiagramList() {
        const filtered = (dataStore.diagrams || []).filter(d => {
          const matchCategory = activeCategory === 'all' || d.type === activeCategory;
          const matchSearch = !searchQuery || 
            (d.title && d.title.toLowerCase().includes(searchQuery)) ||
            (d.id && d.id.toLowerCase().includes(searchQuery)) ||
            (d.description && d.description.toLowerCase().includes(searchQuery));
          return matchCategory && matchSearch;
        });

        diagramListEl.innerHTML = '';
        if (filtered.length === 0) {
          diagramListEl.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-subtle);">No diagrams match filter.</div>';
          return;
        }

        filtered.forEach(diagram => {
          const item = document.createElement('div');
          item.className = 'diagram-item' + (diagram.id === activeDiagramId ? ' active' : '');
          item.dataset.id = diagram.id;

          const isUserflow = diagram.type === 'userflow';
          const badgeClass = isUserflow ? 'badge-userflow' : 'badge-sitemap';
          const badgeText = isUserflow ? 'FLOW' : 'MAP';

          item.innerHTML = `
            <div class="diagram-item__header">
              <span class="diagram-item__title" title="${diagram.title || diagram.id}">${diagram.title || diagram.id}</span>
              <span class="badge-tag ${badgeClass}">${badgeText}</span>
            </div>
            <div class="diagram-item__desc">${diagram.description || 'No description available'}</div>
          `;

          item.addEventListener('click', () => renderDiagram(diagram));
          diagramListEl.appendChild(item);
        });

        // Update counts
        const allCount = (dataStore.diagrams || []).length;
        const mapCount = (dataStore.diagrams || []).filter(d => d.type === 'sitemap').length;
        const flowCount = (dataStore.diagrams || []).filter(d => d.type === 'userflow').length;

        document.getElementById('count-all').textContent = allCount;
        document.getElementById('count-sitemap').textContent = mapCount;
        document.getElementById('count-userflow').textContent = flowCount;
      }

      // 7. Export Handlers (PNG HD, PNG, SVG, Print)
      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function getCleanSvgString() {
        const svg = renderTarget.querySelector('svg');
        if (!svg) return null;
        const clone = svg.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        return new XMLSerializer().serializeToString(clone);
      }

      // SVG Export
      document.getElementById('btn-export-svg').addEventListener('click', () => {
        const svgStr = getCleanSvgString();
        if (!svgStr) return;
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        downloadBlob(blob, `${activeDiagramId || 'diagram'}.svg`);
      });

      // PNG Export Helper
      function exportPngWithScale(multiplier, filenameSuffix) {
        const svg = renderTarget.querySelector('svg');
        if (!svg) return;
        const svgStr = getCleanSvgString();
        if (!svgStr) return;

        const rect = svg.getBoundingClientRect();
        const baseWidth = rect.width / (scale || 1);
        const baseHeight = rect.height / (scale || 1);

        const canvas = document.createElement('canvas');
        canvas.width = baseWidth * multiplier;
        canvas.height = baseHeight * multiplier;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);

        img.onload = () => {
          // Fill background
          ctx.fillStyle = document.body.dataset.theme === 'light' ? '#ffffff' : '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((blob) => {
            if (blob) {
              downloadBlob(blob, `${activeDiagramId || 'diagram'}${filenameSuffix}.png`);
            }
          }, 'image/png');
        };
      }

      document.getElementById('btn-export-png').addEventListener('click', () => {
        exportPngWithScale(1.0, '');
      });

      document.getElementById('btn-export-png-hd').addEventListener('click', () => {
        exportPngWithScale(2.5, '-hd');
      });

      document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
      });

      // 8. Event listeners for UI controls
      document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
      });

      document.getElementById('btn-toggle-inspector').addEventListener('click', () => {
        inspectorEl.classList.toggle('collapsed');
      });

      document.getElementById('btn-close-inspector').addEventListener('click', () => {
        inspectorEl.classList.add('collapsed');
      });

      document.getElementById('btn-theme-toggle').addEventListener('click', () => {
        const current = document.body.dataset.theme;
        document.body.dataset.theme = current === 'light' ? 'dark' : 'light';
      });

      document.getElementById('btn-close-modal').addEventListener('click', () => {
        document.getElementById('screen-sheet-modal').classList.remove('active');
      });

      document.getElementById('screen-sheet-modal').addEventListener('click', (e) => {
        if (e.target.id === 'screen-sheet-modal') {
          e.target.classList.remove('active');
        }
      });

      // Search and Filter Listeners
      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderDiagramList();
      });

      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          activeCategory = pill.dataset.category;
          renderDiagramList();
        });
      });

      // 9. Startup
      renderDiagramList();
      if (dataStore.diagrams && dataStore.diagrams.length > 0) {
        renderDiagram(dataStore.diagrams[0]);
      }
    })();
  </script>
</body>
