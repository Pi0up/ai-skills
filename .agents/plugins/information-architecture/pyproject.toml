[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "information-architecture-tools"
version = "0.3.0"
description = "CLI tool suite and validation engine for Information Architecture"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Vincent Perrery" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Pi0up/ai-skills"
Repository = "https://github.com/Pi0up/ai-skills"
Issues = "https://github.com/Pi0up/ai-skills/issues"

[project.scripts]
ia-tools = "ia_tools.cli:main"

[tool.setuptools.packages.find]
include = ["ia_tools*"]

[tool.setuptools.package-data]
"ia_tools" = ["py.typed"]
